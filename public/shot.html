<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Stitch Math sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=5">
<style>
  body { width: 1000px; height: var(--h, 560px); margin: 0; overflow: hidden; padding: 20px 24px; box-sizing: border-box; }
  .wrap { display: grid; grid-template-columns: var(--cols, 330px 1fr); gap: 18px; height: 100%; }
  .left h1 { font-size: 34px; margin: 6px 0 10px; } .left p { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
  .brand { margin-bottom: 14px; }
  table.grid td.text { min-width: 0; width: 250px; max-width: 250px; font-size: 11.5px; position: static; box-shadow: none; }
  table.grid th, table.grid td { padding: 4px 6px; } .c { min-width: 50px; font-size: 13px; }
  .note-box { margin: 10px 0 0; font-size: 13.5px; }
</style></head>
<body>
<div class="wrap">
  <div class="left" id="left"></div>
  <div class="sheet" style="overflow:hidden">
    <div class="sheet-head"><div class="summary" id="summary"></div></div>
    <div class="scroller"><table class="grid" id="grid"></table></div>
  </div>
</div>
<script type="module">
  const q = new URLSearchParams(location.search);
  const which = q.get("s") || "hat", mode = q.get("mode") || "before";
  const s = await fetch("/api/samples").then((r) => r.json());
  const { report: r } = await fetch("/api/check", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ pattern: s[which] }) }).then((x) => x.json());
  const sc = (k) => `var(--s${k % 6})`;
  const n = r.findings.length;
  document.querySelector("#summary").innerHTML = `<strong>${n ? `${n} mistakes found` : "No mistakes found"}</strong> <span class="meta">${r.checked}/${r.total} rows checked · ${r.sizes.length} sizes</span>`;
  const rows = r.lines.filter((l) => l.kind !== "note").slice(0, Number(q.get("rows") || 14));
  document.querySelector("#grid").innerHTML = `<thead><tr><th>Row</th>${r.sizes.map((z, k) => `<th class="size" style="--sc:${sc(k)}"><span>${z}</span></th>`).join("")}</tr></thead><tbody>` +
    rows.map((l) => `<tr><td class="text">${l.text.slice(0, 46)}</td>${l.cells.map((c, k) => `<td class="cell" style="--sc:${sc(k)}"><span class="c ${c.status}">${c.after ?? "?"}${c.stated != null && c.after != null && c.stated !== c.after ? `<small>says ${c.stated}</small>` : ""}</span></td>`).join("")}</tr>`).join("") + "</tbody>";
  const f = r.findings.find((x) => x.kind === "count") ?? r.findings[0];
  const lab = (i) => r.lines.find((l) => l.i === i)?.label;
  const left = {
    cover: `<div class="brand"><svg width="24" height="24" viewBox="0 0 24 24" style="color:var(--accent)"><use href="/icon.svg#mark"/></svg> Stitch Math</div><p class="kicker">A first-pass tech edit for knitting designers</p><h1>Grade every size at once.</h1><p>Gemma reads each row. Code counts every size. A red cell is a count that doesn't add up.</p>` + (f ? `<div class="note-box err"><b>${lab(f.i)} · ${r.sizes[f.size]}</b><div>${f.msg}</div><p class="fix">${f.fix ?? ""}</p></div>` : ""),
    before: `<p class="kicker">Before</p><h1 style="font-size:28px">2 mistakes in a 4-size hat</h1>` + r.findings.map((x) => `<div class="note-box err"><b>${lab(x.i)} · ${r.sizes[x.size]}</b><div>${x.msg}</div><p class="fix">${x.fix ?? ""}</p></div>`).join(""),
    after: `<p class="kicker">After</p><h1 style="font-size:28px">Same hat, two numbers fixed</h1><p>Cast-on for Adult S changed from 76 to 80, and Rnd 3 Adult L from 68 to 66.</p><div class="clean">Every row adds up in every size.</div>`,
  }[mode];
  document.querySelector("#left").innerHTML = left;
</script>
</body></html>
