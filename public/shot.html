<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Stitch Math check</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  :root { color-scheme: light; --bg:#f7f3ec; --card:#fffdf9; --ink:#1f1a14; --muted:#6b6257; --line:#e6ddd0; --accent:#8a3b4f; --ok:#2f7a55; --ok-bg:#e5f2ea; --err:#b42c2c; --err-bg:#fbe7e4; --unc:#8d857b; --unc-bg:#efeae2; }
  body { width: 1000px; height: 560px; margin: 0; overflow: hidden; padding: 22px 26px; box-sizing: border-box; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .summary strong { font-size: 22px; } .finding { padding: 10px 13px; font-size: 13.5px; } .finding .row-text { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clean { font-size: 15px; } table { font-size: 12.5px; } td.text { min-width: 0; max-width: 250px; font-size: 11.5px; } th, td { padding: 5px 6px; } .c { min-width: 36px; padding: 1px 5px; }
  .grid-wrap { padding: 8px 12px; }
</style></head>
<body>
  <div><div class="summary" id="summary"></div><ol class="findings" id="findings"></ol></div>
  <div class="grid-wrap"><table id="grid"></table></div>
<script type="module">
  const which = new URLSearchParams(location.search).get("s") || "hat";
  const s = await fetch("/api/samples").then((r) => r.json());
  const { report: r } = await fetch("/api/check", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ pattern: s[which] }) }).then((x) => x.json());
  const by = new Map(r.lines.map((l) => [l.i, l]));
  const n = r.findings.length;
  document.querySelector("#summary").innerHTML = `<strong>${n ? `${n} problems found` : "No problems found"}</strong> <span class="meta">${r.checked} of ${r.total} rows checked · ${r.sizes.length} sizes</span>`;
  document.querySelector("#findings").innerHTML = n ? r.findings.map((f) => { const l = by.get(f.i); return `<li class="finding"><div class="where">${l.label} <span>· ${r.sizes[f.size]}</span></div><div class="row-text">${l.text}</div><div>${f.msg}</div><p class="fix">${f.fix ?? ""}</p></li>`; }).join("") : `<li class="clean">Every row adds up in every size.</li>`;
  const rows = r.lines.filter((l) => l.kind !== "note").slice(0, 15);
  document.querySelector("#grid").innerHTML = `<thead><tr><th>Row</th>${r.sizes.map((z) => `<th>${z}</th>`).join("")}</tr></thead><tbody>` +
    rows.map((l) => `<tr><td class="text">${l.text.slice(0, 44)}</td>${l.cells.map((c) => `<td class="cell"><span class="c ${c.status}">${c.after ?? "–"}</span></td>`).join("")}</tr>`).join("") + "</tbody>";
</script>
</body></html>
